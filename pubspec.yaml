name: mobile_app_starter
description: A new Flutter project.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  bloc_concurrency: ^0.3.0
  cached_network_image: ^3.4.1
  # Required even though no app code references CupertinoIcons: the Cupertino
  # library inside package:flutter does, and the icon tree-shaker warns on every
  # release build when the font package is absent.
  cupertino_icons: ^1.0.9
  dio: ^5.11.0
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.2.1
  go_router: ^17.5.0
  # Pinned transitively by flutter_localizations; an explicit constraint here
  # would eventually conflict with an SDK bump.
  hydrated_bloc: ^11.0.0
  intl: any
  json_annotation: ^4.12.0
  logger: ^2.7.0
  material_ui: ^1.0.0
  path_provider: ^2.1.6
  stream_transform: ^2.1.1

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.0
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.4.0
  json_serializable: ^6.14.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  # Required: gates `flutter gen-l10n` running on pub get / run / build.
  generate: true
  # All tracked, so a fresh clone builds with no manual setup. They ship as
  # plaintext assets inside the binary: NEVER put a secret in them — use
  # --dart-define for anything sensitive. Selected at run time with
  # --dart-define=ENV_FILE=.env.staging (default: .env.dev).
  assets:
    - .env.dev
    - .env.staging
    - .env.prod
