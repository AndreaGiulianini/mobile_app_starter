org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Built-in Kotlin migration (AGP 9): the app module no longer applies the
# Kotlin Gradle plugin, so AGP's bundled Kotlin support compiles MainActivity.
# newDsl stays false until AGP 10 removes the opt-out.
# https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin
android.newDsl=false
android.builtInKotlin=true
